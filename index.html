<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>พื้นที่ทบทวนความรู้สึก</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: url("bg.png") no-repeat center center/cover;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      width: 90%;
      max-width: 560px;
      padding: 30px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.20);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      color: #2c3e50;
    }

    .subtitle {
      color: #5d6d7e;
      margin: 10px 0 20px;
      line-height: 1.6;
    }

    .warning {
      background: rgba(255, 255, 255, 0.55);
      padding: 12px;
      border-radius: 14px;
      color: #8e44ad;
      margin-bottom: 15px;
      font-size: 15px;
      line-height: 1.6;
    }

    input, textarea {
      width: 100%;
      border-radius: 15px;
      border: none;
      padding: 14px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.70);
      outline: none;
      box-sizing: border-box;
      color: #2c3e50;
      margin-bottom: 12px;
    }

    textarea {
      height: 180px;
      resize: vertical;
    }

    input::placeholder,
    textarea::placeholder {
      color: #7f8c8d;
    }

    button {
      margin-top: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 22px;
      font-size: 16px;
      cursor: pointer;
      background: linear-gradient(135deg, #7aa7ff, #ff9ed2);
      color: white;
      box-shadow: 0 6px 18px rgba(122, 167, 255, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 22px rgba(255, 158, 210, 0.28);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #msg {
      margin-top: 14px;
      color: #27ae60;
      font-weight: 600;
      min-height: 24px;
    }

    .top-heart {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .bottom-note {
      margin-top: 12px;
      color: #6c7a89;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 22px;
        border-radius: 22px;
      }

      h1 {
        font-size: 24px;
      }

      textarea {
        height: 160px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="top-heart">💗</div>

    <h1>พื้นที่ทบทวนความรู้สึก</h1>

    <p class="subtitle">
      กรุณากรอกข้อมูลและเขียนทบทวนความรู้สึกของตนเอง
    </p>

    <div class="warning">
      เขียนทบทวนตามแนวคิด CBT เช่น  
      เกิดอะไรขึ้น? คิดอะไร? รู้สึกอย่างไร? ตอบสนองอย่างไร? และมองใหม่ได้อย่างไร?
    </div>

    <input type="text" id="firstName" placeholder="ชื่อ">
    <input type="text" id="lastName" placeholder="นามสกุล">
    <input type="text" id="address" placeholder="ที่อยู่ / อำเภอ / จังหวัด">

    <textarea id="writing" placeholder="พิมพ์ข้อความทบทวนความรู้สึกของคุณที่นี่..."></textarea>

    <button id="sendBtn" onclick="sendData()">💗 ส่งข้อมูล</button>

    <p id="msg"></p>

    <div class="bottom-note">
      ขอบคุณที่ให้เวลากับความรู้สึกของตัวเอง
    </div>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbxYUJfi0oxCT2xfcykdc15c8KW2lxTO3mEbOMu3OQ5FtDZ8zYrueQR-MgfkWCnsBiRb/exec";

    function sendData() {
      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const address = document.getElementById("address").value.trim();
      const writing = document.getElementById("writing").value.trim();
      const msg = document.getElementById("msg");
      const sendBtn = document.getElementById("sendBtn");

      if (!firstName || !lastName || !address || !writing) {
        msg.style.color = "#c0392b";
        msg.innerHTML = "กรุณากรอกข้อมูลให้ครบทุกช่องค่ะ";
        return;
      }

      sendBtn.disabled = true;
      sendBtn.innerHTML = "กำลังส่งข้อมูล...";
      msg.style.color = "#5d6d7e";
      msg.innerHTML = "โปรดรอสักครู่";

      const data = {
        firstName: firstName,
        lastName: lastName,
        address: address,
        writing: writing
      };

      fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      })
      .then(() => {
        msg.style.color = "#27ae60";
        msg.innerHTML = "บันทึกข้อมูลเรียบร้อยแล้วค่ะ 💙";

        document.getElementById("firstName").value = "";
        document.getElementById("lastName").value = "";
        document.getElementById("address").value = "";
        document.getElementById("writing").value = "";
      })
      .catch(() => {
        msg.style.color = "#c0392b";
        msg.innerHTML = "ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง";
      })
      .finally(() => {
        sendBtn.disabled = false;
        sendBtn.innerHTML = "💗 ส่งข้อมูล";
      });
    }
  </script>
</body>
</html>
